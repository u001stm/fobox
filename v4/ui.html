<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOBOX 4.0</title>
<style>
:root{--bg:#0f1218;--side:#12161e;--card:#171c25;--card2:#1d2330;--line:#262e3b;--text:#eef1f7;--muted:#8d97a8;--accent:#7738FF;--accent-soft:#7738ff26;--blue:#4DB5FF;--ok:#37c08a;--warn:#f0b14a;--bad:#ef5d6b;--gold:#ffcc4d;
 font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
:root[data-theme=light]{--bg:#f4f5f8;--side:#fff;--card:#fff;--card2:#f0f2f6;--line:#e1e5ec;--text:#161a22;--muted:#677184}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
aside{position:fixed;inset:0 auto 0 0;width:52px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20;transition:width .15s;overflow:hidden}
aside.open{width:228px;box-shadow:8px 0 30px #0006}
aside:not(.open) .brand>span:last-child,aside:not(.open) .nb>span:last-child{opacity:0}
.brand{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;cursor:pointer;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px;flex-shrink:0}
nav{display:flex;flex-direction:column;gap:2px;padding:6px}
.nb{display:flex;align-items:center;gap:14px;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;text-align:left}
.nb:hover{background:var(--card2);color:var(--text)}.nb.on{background:var(--accent-soft);color:var(--text)}.nb.on svg{color:var(--accent)}
.nb.new{color:var(--text)}.nb.new svg{color:var(--blue)}
.sp{flex:1}.me{margin:6px}.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
main{margin-left:52px;min-height:100vh}
.page{padding:26px 32px 40px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:24px;margin:0;font-weight:700}h2{font-size:15px;margin:0 0 14px;font-weight:600}.mut{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],input:not([type]){background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a4456}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:none}.btn:disabled{opacity:.45;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpi .l{color:var(--muted);font-size:12.5px}.kpi .v{font-size:30px;font-weight:700;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.delta{font-size:12px;color:var(--muted)}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:500}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;background:var(--card2);color:var(--muted)}
.pill.exported{background:#37c08a22;color:var(--ok)}.pill.reviewed{background:#4db5ff22;color:var(--blue)}.pill.analyzed{background:var(--accent-soft);color:#b7a0ff}
.rec{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.rec:last-child{border:0}.rec b{font-variant-numeric:tabular-nums}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}.heat i{width:12px;height:12px;border-radius:3px;background:var(--card2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars span{width:100%;max-width:38px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}.bars small{color:var(--muted);font-size:11px;white-space:nowrap}
.meter{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}.meter span{display:block;height:100%;background:var(--accent)}
/* review */
.rv{display:grid;grid-template-columns:270px 1fr;height:100vh}
.rv-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--side)}
.rv-head{padding:16px;border-bottom:1px solid var(--line)}
.secs{overflow:auto;padding:8px;flex:1}
.sec{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;margin-bottom:2px}
.sec:hover{background:var(--card2)}.sec.on{background:var(--accent-soft)}
.sec .t{display:flex;justify-content:space-between;gap:6px}.sec .s{color:var(--muted);font-size:12px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;margin-right:7px;flex-shrink:0;align-self:center}.dot.ok{background:var(--ok)}.dot.part{background:var(--warn)}
.rv-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:9px}.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px #0004}
.grid{flex:1;overflow:auto;padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,190px),1fr));gap:10px;align-content:start;grid-auto-rows:max-content}
.tile{position:relative;border-radius:9px;overflow:hidden;background:var(--card);border:2px solid transparent;cursor:pointer;outline:none}
.tile:focus-visible{border-color:var(--blue)}.tile.on{border-color:var(--accent)}
.tile .im{aspect-ratio:3/2;background:#0b0d12 center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px}
.tile.ctx .im{opacity:.55}.tile.on .im{opacity:1}
.tile .cap{display:flex;justify-content:space-between;padding:6px 8px;font-size:11.5px;color:var(--muted);gap:6px}
.tile .cap b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;border:2px solid #fff9;background:#0007;display:grid;place-items:center}
.tile.on .chk{background:var(--accent);border-color:var(--accent)}.tile.on .chk:after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.star{position:absolute;top:6px;left:8px;color:var(--gold);font-size:17px;text-shadow:0 1px 3px #000}
.sug{position:absolute;top:8px;left:8px;background:#4db5ffdd;color:#04121f;border-radius:5px;font-size:10.5px;padding:1px 6px;font-weight:600}
.star+.sug{left:30px}
.more{position:absolute;right:7px;bottom:34px;width:26px;height:22px;border-radius:6px;border:0;background:#000a;color:#fff;cursor:pointer;font-size:15px;line-height:1;opacity:0;transition:opacity .1s}
.tile:hover .more,.tile:focus-within .more,.tile .more.show{opacity:1}
.menu{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;min-width:230px;box-shadow:0 10px 30px #0008}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--card2)}.menu .bad{color:var(--bad)}.menu .h{color:var(--muted);font-size:12px;padding:6px 10px 4px}
.other{position:absolute;bottom:34px;left:8px;background:#000b;color:#fff;font-size:10.5px;border-radius:5px;padding:1px 6px}
.flag{position:absolute;bottom:34px;left:8px;background:#ef5d6bdd;color:#fff;font-size:10.5px;border-radius:5px;padding:1px 6px}
.foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.warn{background:#f0b14a1f;color:var(--warn);border-radius:8px;padding:9px 12px;font-size:12.5px;margin:10px 18px 0}
.err{background:#ef5d6b1f;color:var(--bad)}
/* modal */
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(620px,100%);max-height:92vh;overflow:auto}
.f{display:grid;gap:6px;margin-bottom:12px}.f label{color:var(--muted);font-size:12.5px}.f .row input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:3px;margin-bottom:14px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--accent);color:#fff}
.prog{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin:10px 0}.prog span{display:block;height:100%;background:var(--blue);transition:width .2s}
.lb{position:fixed;inset:0;background:#000e;z-index:60;display:grid;grid-template-rows:1fr auto;cursor:zoom-out}.lb img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;display:block;align-self:center}
.lb div{padding:12px 20px;color:#ccc;font-size:13px;text-align:center}
.toast{position:fixed;bottom:18px;right:18px;background:var(--card);border:1px solid var(--line);padding:11px 15px;border-radius:10px;z-index:70;box-shadow:0 8px 30px #0006;max-width:420px}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.stabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--muted)}.stabs button.on{border-color:var(--accent);color:var(--text)}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--text)}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.rv{grid-template-columns:1fr;height:auto}.rv-side{max-height:40vh}.grid{min-height:60vh}}
@media(max-width:560px){.page{padding:18px 14px}.kpis{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="side"></aside>
<main id="main"></main>
<div id="layer"></div>
<script>
const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 shoot:'<rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>',
 perf:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 qual:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>',
 ai:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/><circle cx="12" cy="12" r="3"/>',
 flow:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h7a3 3 0 0 1 0 6H10a3 3 0 0 0 0 6h7"/>',
 hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>'};
const ico=n=>`<svg class="i" viewBox="0 0 24 24">${I[n]}</svg>`;
const PAGES=[['overview','Обзор','home'],['shoot','Текущая съёмка','shoot'],['perf','Производительность','perf'],['quality','Качество','qual'],['ai','Автоотбор','ai'],['flow','Рабочий процесс','flow'],['history','История съёмок','hist'],['settings','Настройки','set']];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('ru-RU');
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
let S={page:'overview',stats:null,cfg:null,sid:localStorage.getItem('fobox.sid')||'',sess:null,sec:0,tab:'all',sel:new Set(),dirty:false,period:'all'};
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Ошибка сервера'}));if(!r.ok)throw Error(j.error||'Ошибка');return j}
function toast(t,bad){const d=document.createElement('div');d.className='toast';if(bad)d.style.borderColor='var(--bad)';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),bad?6000:2800)}
function side(){const p=S.cfg?.profile||{};const ini=(p.name||'Ф').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
 $('#side').innerHTML=`<div class="brand" onclick="$('#side').classList.toggle('open')"><span class="logo">F</span><span>FOBOX 4.0</span></div>
 <nav><button class="nb new" onclick="importDlg()">${ico('plus')}<span>Новая съёмка</span></button>${PAGES.map(([k,t,i])=>`<button class="nb ${S.page===k?'on':''}" title="${t}" onclick="go('${k}')">${ico(i)}<span>${t}</span></button>`).join('')}</nav>
 <div class="sp"></div><button class="nb me" onclick="go('settings','Профиль')"><span class="av">${esc(ini)}</span><span>${esc(p.name||'Профиль фотографа')}</span></button>`}
function go(p,sub){S.page=p;S.sub=sub;$('#side').classList.remove('open');side();render()}
async function load(){[S.stats,S.cfg]=await Promise.all([api('/api/stats'),api('/api/settings')]);applyTheme();if(!S.sid&&S.stats.sessions[0])S.sid=S.stats.sessions[0].id;side();render()}
function applyTheme(){const s=S.cfg.settings;document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--accent-soft',s.accent+'26');document.documentElement.dataset.theme=s.theme}
function render(){const m=$('#main');if(S.page==='shoot')return renderShoot();const f={overview,perf,quality,ai,flow,history,settings}[S.page];m.innerHTML='<div class="page">'+f()+'</div>';if(S.page==='settings')bindSettings()}
const head=(t,sub,right='')=>`<div class="top"><div><h1>${t}</h1><div class="mut">${sub}</div></div><div class="row">${right}</div></div>`;
const kpi=(l,v,d='')=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="delta ${d.cls||''}">${d.t||'&nbsp;'}</div></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
const NODATA='Нет данных — импортируйте съёмку';
// ---------- period filtering
function periodRange(p,shift=0){const n=new Date();if(p==='month'){const a=new Date(n.getFullYear(),n.getMonth()-shift,1),b=new Date(n.getFullYear(),n.getMonth()-shift+1,1);return[a,b]}if(p==='year'){return[new Date(n.getFullYear()-shift,0,1),new Date(n.getFullYear()-shift+1,0,1)]}return[new Date(0),new Date(9e12)]}
const iso=d=>d.toISOString().slice(0,10);
function agg(p,shift){const [a,b]=periodRange(p,shift),A=iso(a),B=iso(b);const ss=S.stats.sessions.filter(s=>s.shoot_date&&s.shoot_date>=A&&s.shoot_date<B);
 return{sessions:ss.length,frames:ss.reduce((x,s)=>x+s.frames,0),hours:ss.some(s=>s.hours!=null)?ss.reduce((x,s)=>x+(s.hours||0),0):null,students:ss.reduce((x,s)=>x+s.students,0)}}
function delta(cur,prev,key){if(S.period==='all')return{t:'За всё время'};const p=prev[key],c=cur[key];if(!p||c==null)return{t:'Нет данных для сравнения'};const d=c-p,pc=Math.round(d/p*100);return{t:`${d>=0?'+':''}${fmt(Math.round(d*10)/10)} (${pc>=0?'+':''}${pc}%) к ${S.period==='month'?'прошлому месяцу':'прошлому году'}`,cls:d>0?'up':d<0?'down':''}}
function overview(){const st=S.stats;if(!st.sessions.length)return head('Обзор','Локальная статистика по вашим съёмкам')+onboarding();
 const cur=agg(S.period,0),prev=agg(S.period,1);
 const sel=`<select onchange="S.period=this.value;render()">${[['month','Этот месяц'],['year','Этот год'],['all','Всё время']].map(([v,t])=>`<option value="${v}" ${S.period===v?'selected':''}>${t}</option>`).join('')}</select>`;
 const note=S.period==='month'?'<div class="mut" style="margin:-12px 0 14px">Текущий месяц неполный — сравнение с полным прошлым месяцем.</div>':'';
 return head('Обзор','Локальная статистика по вашим съёмкам',sel)+note+`<div class="kpis">${kpi('Проведено съёмок',fmt(cur.sessions),delta(cur,prev,'sessions'))}${kpi('Отснято кадров',fmt(cur.frames),delta(cur,prev,'frames'))}${kpi('Часы съёмок <span class="mut">(по EXIF)</span>',cur.hours==null?'—':fmt(Math.round(cur.hours*10)/10),delta(cur,prev,'hours'))}${kpi('Готовые комплекты',fmt(st.kits),{t:'Ученики с подтверждёнными портретами и друзьями'})}</div>
 <div class="g2"><div class="card"><h2>Кадры по месяцам</h2>${monthBars()}</div><div class="card"><h2>Рекорды</h2>${records()}</div></div>
 <div class="g2"><div class="card"><h2>Последние съёмки</h2>${sessTable(st.sessions.slice(0,6))}</div><div class="card"><h2>Календарь активности</h2>${heat()}</div></div>`}
function onboarding(){return `<div class="card" style="padding:30px"><h2 style="font-size:18px">С чего начать</h2><div class="g3" style="margin-top:6px">
 ${[['1. Новая съёмка','Укажите папку с карты или диска. FOBOX прочитает RAW и JPEG, время съёмки и разобьёт кадры на серии. Исходники не меняются.'],['2. Отбор','Программа отметит пустые, тёмные, нерезкие кадры и дубли и сама предложит лучшие. Вы кликами правите выбор и подтверждаете.'],['3. Экспорт','Подтверждённые кадры копируются в новую папку заказа. Статистика на этой странице считается автоматически.']].map(([t,d])=>`<div><b>${t}</b><p class="mut" style="line-height:1.55">${d}</p></div>`).join('')}
 </div><button class="btn pri" onclick="importDlg()" style="margin-top:8px">Импортировать первую съёмку</button></div>`}
function monthBars(){const m=S.stats.months,ks=Object.keys(m).slice(-12);if(!ks.length)return empty(NODATA);const mx=Math.max(...ks.map(k=>m[k].frames),1);

 <select title="Размер плиток" onchange="document.documentElement.style.setProperty('--tile',this.value)"><option value="150px">S</option><option value="190px" selected>M</option><option value="260px">L</option></select></div></div>
 ${d.conflicts.length?`<div class="warn">Ведомость: ${esc(d.conflicts.slice(0,4).join('; '))}${d.conflicts.length>4?'…':''}. Экспорт заблокирован: исправьте ведомость и импортируйте заново, или назначьте нужную роль кадру через «⋯».</div>`:''}
 ${missing.length?`<div class="warn" style="background:var(--card2);color:var(--muted)">Не назначено: ${missing.map(k=>ALAB[k]).join(', ')}. Наведите на нужный кадр и нажмите «⋯» → «Сделать …». Если кадра нет — оставьте пустым.</div>`:''}
 ${s.overridden?`<div class="warn" style="background:var(--accent-soft);color:var(--text)">Роли в этой секции исправлены вручную. <button class="btn" style="padding:3px 10px;margin-left:8px" onclick="setRole(null,null,true)">Вернуть как в ведомости</button></div>`:''}
 ${d.absent&&d.absent.length?`<div class="warn" style="background:var(--card2);color:var(--muted)">Без номеров в ведомости (пропущены, экспорт не мешают): ${esc(d.absent.join(', '))}</div>`:''}
 ${!d.pillow?'<div class="warn">Проверка качества выключена — установите Pillow: <kbd>py -m pip install pillow</kbd></div>':''}
 ${files.filter(f=>must[f.path]&&f.flags).map(f=>`<div class="warn">Обязательный кадр ${esc(f.name)} (${ALAB[must[f.path]]||must[f.path]}) помечен как «${esc(f.flags.split(',').map(x=>d.flag_names[x]).join(', '))}». Проверьте ведомость.</div>`).join('')}
 <div class="grid" id="grid">${list.length?list.map(f=>tile(f,must,sug,otherOf[f.path])).join(''):`<div class="empty" style="grid-column:1/-1">${S.tab==='bad'?'Проблемных кадров нет':S.tab==='kit'?'Пока ничего не выбрано':'Нет кадров'}</div>`}</div>
 <div class="foot"><div class="mut">Клик — выбрать · двойной клик — крупно · <kbd>←</kbd><kbd>→</kbd> секции · <kbd>Enter</kbd> подтвердить</div><div class="row">${S.dirty?'<span class="mut">Есть несохранённые изменения</span>':''}<button class="btn" onclick="save(false)">Сохранить</button><button class="btn pri" onclick="save(true)">${d.approved[s.id]&&!S.dirty?'Подтверждено ✓':'Подтвердить и дальше'}</button></div></div></div></div>`}
function tile(f,must,sug,other){const sec=S.sess.sections[S.sec];
 if(other!==undefined){const o=S.sess.sections[other];const om=o.mandatory[f.path];
  return `<div class="tile on" tabindex="0" title="Открыть секцию «${esc(o.subtitle)}»" onclick="pickSec(${other})" data-p="${esc(f.path)}" ondblclick="event.stopPropagation();lightbox(this.dataset.p)"><div class="im" style="${f.has_preview?`background-image:url('/api/preview?s=${S.sid}&p=${encodeURIComponent(f.path)}&size=480')`:''}"></div>${om?'<span class="star">★</span>':''}<span class="other">${esc(o.subtitle)}</span><span class="chk"></span><div class="cap"><b>${esc(f.name)}</b><span>${om?ALAB[om]||om:f.capture_at.slice(11,19)}</span></div></div>`}
 const on=S.sel.has(f.path),m=must[f.path];const fl=f.flags?f.flags.split(',').map(x=>S.sess.flag_names[x]).join(', '):'';
 return `<div class="tile ${on?'on':'ctx'}" tabindex="0" data-p="${esc(f.path)}" onclick="tog(this)" ondblclick="lightbox(this.dataset.p)">${(sec.roles||[]).length?`<button class="more ${m?'show':''}" title="Роль кадра / не тот человек" onclick="event.stopPropagation();roleMenu(this)">⋯</button>`:''}<div class="im" style="${f.has_preview?`background-image:url('/api/preview?s=${S.sid}&p=${encodeURIComponent(f.path)}&size=480')`:''}">${f.has_preview?'':'Нет превью'}</div>
 ${m?`<span class="star" title="Обязательный: ${ALAB[m]||m}">★</span>`:''}${sug.has(f.path)?'<span class="sug" title="Предложено автоотбором">авто</span>':''}${fl?`<span class="flag">${esc(fl)}</span>`:''}<span class="chk"></span>
 <div class="cap"><b>${esc(f.name)}</b><span>${m?ALAB[m]||m:f.capture_at.slice(11,19)}</span></div></div>`}
function tog(el){const p=el.dataset.p,s=S.sess.sections[S.sec];if(!s.files.includes(p))return;if(s.mandatory[p]){toast('Это кадр из ведомости. Если на нём другой человек — нажмите «⋯» → «Не тот человек»');return}
 if(S.sel.has(p))S.sel.delete(p);else{if(s.limit&&S.sel.size>=s.limit)return toast('Максимум '+s.limit+' кадров');S.sel.add(p)}
 S.dirty=true;el.classList.toggle('on',S.sel.has(p));el.classList.toggle('ctx',!S.sel.has(p));if(S.tab==='kit')drawShoot();else{const b=$('.bar .mut');if(b)b.firstChild.textContent=S.sel.size+' выбрано из '+s.files.length}}
function roleMenu(btn){const el=btn.closest('.tile'),p=el.dataset.p,s=S.sess.sections[S.sec],cur=s.mandatory[p];closeMenu();
 const m=document.createElement('div');m.className='menu';m.id='rmenu';
 m.innerHTML=`<div class="h">${esc(S.fmap[p].name)}</div>`+s.roles.filter(k=>k!==cur).map(k=>`<button data-r="${k}">Сделать: ${ALAB[k]}${Object.values(s.mandatory).includes(k)?' <span class="mut">(заменить)</span>':''}</button>`).join('')+(cur?`<button class="bad" data-r="">Не тот человек — снять ${ALAB[cur]}</button>`:'');
 m.querySelectorAll('button').forEach(b=>b.onclick=()=>{closeMenu();setRole(p,b.dataset.r||null)});document.body.append(m);
 const r=btn.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-10)+'px';m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-10)+'px';
 setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0)}
function closeMenu(){const m=$('#rmenu');if(m)m.remove()}
async function setRole(path,role,reset){const s=S.sess.sections[S.sec];try{if(S.dirty)await api('/api/review',{session:S.sid,section:s.id,selected:[...S.sel],approved:false});
 await api('/api/role',{session:S.sid,section:s.id,path,role,reset:!!reset});const id=s.id;S.sess=await api('/api/session?id='+S.sid);S.fmap=Object.fromEntries(S.sess.files.map(f=>[f.path,f]));
 S.sec=Math.max(0,S.sess.sections.findIndex(x=>x.id===id));loadSec();drawShoot();toast(reset?'Роли как в ведомости':role?'Назначено: '+ALAB[role]:'Снято. Назначьте правильный кадр через «⋯» или оставьте пустым')}catch(e){toast(e.message,1)}}
function pickSec(i){if(S.dirty&&!confirm('Есть несохранённые изменения. Перейти без сохранения?'))return;S.sec=i;loadSec();drawShoot();$('#grid').scrollTop=0}
async function save(approved){const s=S.sess.sections[S.sec];try{await api('/api/review',{session:S.sid,section:s.id,selected:[...S.sel],approved});S.sess.selected[s.id]=[...S.sel];S.sess.approved[s.id]=approved;S.dirty=false;
 if(approved){toast('Подтверждено: '+s.title);const nx=S.sess.sections.findIndex((x,i)=>i>S.sec&&!S.sess.approved[x.id]);const any=nx<0?S.sess.sections.findIndex(x=>!S.sess.approved[x.id]):nx;if(any>=0){S.sec=any;loadSec()}else toast('Все секции подтверждены — можно экспортировать')}else toast('Сохранено');drawShoot();S.stats=await api('/api/stats')}catch(e){toast(e.message,1)}}
function lightbox(p){const f=S.fmap[p];if(!f.has_preview)return;$('#layer').innerHTML=`<div class="lb" onclick="closeL()"><img src="/api/preview?s=${S.sid}&p=${encodeURIComponent(p)}&size=1800"><div>${esc(f.name)} · ${f.capture_at}${f.flags?' · '+esc(f.flags.split(',').map(x=>S.sess.flag_names[x]).join(', ')):''} · серия ${f.series}</div></div>`}
async function reanalyze(){$('#layer').innerHTML=`<div class="modal"><div class="dlg"><h2>Проверка качества</h2><div id="ra"></div></div></div>`;try{await api('/api/reanalyze',{session:S.sid});await watchJob(S.sid,'#ra');closeL();S.sess=null;await load()}catch(e){closeL();toast(e.message,1)}}
function exportDlg(){const ss=S.sess.session,meta=JSON.parse(ss.meta||'{}');const school=ss.mode==='school';
 $('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeL()"><div class="dlg"><h2 style="font-size:18px">Экспорт</h2><p class="mut">Подтверждённые кадры копируются в новую папку. Исходники не трогаются, существующие файлы не перезаписываются.</p>
 <div class="f"><label>Папка для экспорта</label><div class="row"><input id="e_out" value="${esc(meta.output||'')}" placeholder="F:\\FOBOX_EXPORT"><button class="btn" onclick="pick('e_out','dir')">Обзор…</button></div></div>
 ${school?`<div class="f"><label>Фон (один файл, необязательно)</label><div class="row"><input id="e_bg" value="${esc(meta.background||'')}" placeholder="Полный путь к файлу фона"><button class="btn" onclick="pick('e_bg','file')">Обзор…</button></div></div>`:''}
 <div id="e_info"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" onclick="closeL()">Закрыть</button><button class="btn" onclick="exp(true)">Проверить</button><button class="btn pri" onclick="exp(false)">Копировать</button></div></div></div>`}
async function exp(dry){const out=$('#e_out').value.trim(),info=$('#e_info');try{const meta={session:S.sid,output:out};if($('#e_bg'))meta.background=$('#e_bg').value.trim();await api('/api/meta',meta);
 if(!dry&&!confirm('Скопировать выбранные файлы?'))return;const r=await api('/api/export',{session:S.sid,output:out,dry_run:dry});
 info.innerHTML=`<div class="warn" style="margin:0;background:#37c08a1f;color:var(--ok)">${dry?'Готово к экспорту':'Скопировано'}: ${r.files} файлов, ${(r.bytes/1048576).toFixed(1)} МБ${dry?` · свободно ${(r.free/1073741824).toFixed(1)} ГБ`:''}<br><span style="word-break:break-all">${esc(r.root)}</span></div>`;if(!dry){S.sess=null;S.stats=await api('/api/stats')}}catch(e){info.innerHTML=`<div class="warn err" style="margin:0">${esc(e.message)}</div>`}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')return closeL();if(S.page!=='shoot'||!S.sess||$('#layer').innerHTML||/INPUT|SELECT/.test(e.target.tagName))return;
 if(e.key==='ArrowRight'&&e.altKey===false&&!e.target.classList.contains('tile')){pickSec(Math.min(S.sec+1,S.sess.sections.length-1))}
 else if(e.key==='ArrowLeft'&&!e.target.classList.contains('tile')){pickSec(Math.max(S.sec-1,0))}
 else if(e.key==='Enter'){e.preventDefault();save(true)}else if(e.key===' '&&e.target.classList.contains('tile')){e.preventDefault();tog(e.target)}});
load().catch(e=>{$('#main').innerHTML='<div class="page">'+empty('Сервер недоступен: '+esc(e.message))+'</div>'});
</script>
</body>
</html>
