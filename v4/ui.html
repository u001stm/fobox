<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoboX 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Design tokens follow the FoboX 4.0 mockup: blue-black graphite, violet #7738FF, sky #4DB5FF */
:root{--bg:#0b0f17;--side:#0d121b;--card:#121823;--card2:#182030;--card3:#1e2738;--line:#1f2838;--line2:#2a3446;--text:#e9ecf4;--muted:#8a94a8;--dim:#5f6a80;
 --accent:#7738FF;--accent-soft:#7738ff24;--blue:#4DB5FF;--ok:#2fd18b;--warn:#f3b44c;--bad:#ff5d70;--gold:#ffc940;
 --c1:#7738FF;--c2:#4DB5FF;--c3:#2fd18b;--c4:#f3b44c;--c5:#ff5d70;--c6:#8a94a8;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;color:var(--text);background:var(--bg);color-scheme:dark}
:root[data-theme=light]{--bg:#f3f4f8;--side:#fff;--card:#fff;--card2:#f1f3f7;--card3:#e8ebf2;--line:#e3e6ee;--line2:#d4d9e3;--text:#151925;--muted:#606b80;--dim:#8d96a8;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* shell */
aside#side{position:fixed;inset:0 auto 0 0;width:60px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;z-index:20;transition:width .15s;overflow:hidden}
aside#side.open{width:232px;box-shadow:8px 0 30px #0007}
.brand{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;cursor:pointer;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;letter-spacing:-.5px}
.bname{font-weight:700;font-size:17px;letter-spacing:-.02em}.bname b{color:var(--accent)}
nav{display:flex;flex-direction:column;gap:4px;padding:8px}
.nb{display:flex;align-items:center;gap:14px;padding:9px 10px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;text-align:left;position:relative}
.nb:hover{background:var(--card2);color:var(--text)}.nb.on{background:var(--accent-soft);color:var(--text)}.nb.on svg{color:var(--accent)}
.nb.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nb.new svg{color:var(--blue)}
aside:not(.open) .nb>span:last-child,aside:not(.open) .bname{opacity:0}
.sp{flex:1}.me{margin:8px}.av{width:32px;height:32px;border-radius:50%;background:var(--card3) center/cover;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;color:var(--text);border:1px solid var(--line2)}
main{margin-left:60px;min-height:100vh}
.page{padding:22px 28px 40px;max-width:1520px;display:grid;gap:14px}
/* header + filters */
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.02em}h2{font-size:14px;margin:0;font-weight:600}
.mut{color:var(--muted);font-size:12.5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}.seg button:not(.on):hover{color:var(--text)}
.mnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.mnav button{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:16px}.mnav button:hover:not(:disabled){background:var(--card2);color:var(--text)}.mnav button:disabled{opacity:.3}
.mnav span{min-width:120px;text-align:center;font-size:13px;font-weight:500}
select,input[type=text],input[type=email],input[type=number],input:not([type]),textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none;min-width:0}
select{cursor:pointer}input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:#3b4760}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{background:none;border-color:transparent;color:var(--blue)}.btn:disabled{opacity:.45;cursor:default}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.danger{color:var(--bad);border-color:#ff5d7055}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12.5px;padding:0}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:var(--card3);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--muted)}kbd.inv{background:#ffffff26;border-color:#ffffff33;color:#fff}
/* cards & KPIs */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:6px}.kpi .d{font-size:12.5px;margin-top:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.d.up{color:var(--ok)}.d.down{color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.mini{background:var(--card2);border-radius:11px;padding:12px 14px}.mini .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}.mini .l{color:var(--muted);font-size:12px;margin-top:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;width:14px;vertical-align:3px}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--dim);font-size:11px;font-family:inherit}.chart .gl{stroke:var(--line);stroke-width:1}
.empty{color:var(--muted);text-align:center;padding:34px 10px;border:1px dashed var(--line2);border-radius:11px;font-size:13px}
.split{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ll{display:grid;gap:9px;font-size:13px}.ll>div{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}.ll i{width:10px;height:10px;border-radius:3px}.ll b{font-weight:600;font-variant-numeric:tabular-nums}
.hb{display:grid;gap:12px}.hb>div{display:grid;grid-template-columns:110px 1fr 130px;gap:12px;align-items:center;font-size:13px}.hb .tr{height:10px;background:var(--card3);border-radius:5px;overflow:hidden}.hb .tr span{display:block;height:100%;border-radius:5px;background:var(--accent)}.hb .vv{color:var(--muted);font-variant-numeric:tabular-nums}
.rec{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.rec:last-child{border:0}.rec b{font-variant-numeric:tabular-nums;white-space:nowrap}
.recent{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rc{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px;border-radius:11px;cursor:pointer;border:1px solid transparent}.rc:hover{background:var(--card2);border-color:var(--line)}
.th{width:52px;height:52px;border-radius:9px;background:var(--card3) center/cover no-repeat}.rc .t{font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.status.exported::before{background:var(--ok)}.status.reviewed::before{background:var(--blue)}.status.analyzed::before,.status.imported::before{background:var(--warn)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto}.heat i{width:11px;height:11px;border-radius:3px;background:var(--card3)}
/* next-step guide */
.guide{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--card);border:1px solid #7738ff55;border-radius:14px;padding:12px 16px}
.guide .ic{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700}
.guide .gt{font-weight:600}.guide .gs{color:var(--muted);font-size:12.5px;margin-top:2px}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}.steps span{display:inline-flex;align-items:center;gap:6px}.steps span b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--card3);font-size:11px;font-weight:600}
.steps span.done b{background:var(--ok);color:#06150d}.steps span.cur{color:var(--text)}.steps span.cur b{background:var(--accent);color:#fff}.steps i{width:18px;height:1px;background:var(--line2)}
.guide.warnc{border-color:#f3b44c66;background:linear-gradient(0deg,#f3b44c14,#f3b44c14),var(--card)}.guide.warnc .ic{background:var(--warn);color:#2a1b00}
.guide.okc{border-color:#2fd18b66;background:linear-gradient(0deg,#2fd18b12,#2fd18b12),var(--card)}.guide.okc .ic{background:var(--ok);color:#06150d}
.gx{background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px;padding:0 4px}
/* sub tabs */
.subtabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.subtabs button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap}.subtabs button.on{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px #7738ff66}
/* tables */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}td,th{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}th{color:var(--muted);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
td .tt{display:flex;align-items:center;gap:10px}td .th{width:36px;height:36px;border-radius:7px}
/* settings, profile */
.sl{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.snav{display:grid;gap:2px;padding:8px}.snav button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted)}.snav button.on{background:var(--accent-soft);color:var(--text)}.snav button:hover{color:var(--text)}
.sg{display:grid;gap:4px;margin-bottom:22px}.sg h3{font-size:13px;margin:0 0 8px;font-weight:600}
.sr2{display:grid;grid-template-columns:minmax(160px,1fr) minmax(0,260px);gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.sr2 label{font-size:13px}.sr2 .h{color:var(--muted);font-size:12px;margin-top:2px}
.sr2 input,.sr2 select{width:100%}
.prof{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}.pph{width:200px;height:240px;border-radius:14px;background:var(--card3) center/cover;display:grid;place-items:center;font-size:56px;font-weight:700;color:var(--dim)}
.pf2{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;align-items:center;font-size:13.5px;margin-top:18px}.pf2 .k{color:var(--muted)}
.soc{display:flex;gap:8px}.soc a,.soc span{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700;text-decoration:none}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--text)}
/* dialogs */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}.modal.top{align-items:start;padding-top:12vh}
.dlg{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px #000a}.dlg.wide{width:min(860px,100%)}
.f{display:grid;gap:6px;margin-bottom:12px}.f label{color:var(--muted);font-size:12.5px}.f .row input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segw{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:14px}.segw button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)}.segw button.on{background:var(--accent);color:#fff}
.prog{height:6px;background:var(--card3);border-radius:4px;overflow:hidden;margin:10px 0}.prog span{display:block;height:100%;background:var(--blue);transition:width .2s}
.warn{background:#f3b44c1a;color:var(--warn);border-radius:10px;padding:9px 12px;font-size:12.5px}.err{background:#ff5d701a;color:var(--bad)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--card3);border:1px solid var(--line2);padding:11px 15px;border-radius:11px;z-index:90;box-shadow:0 8px 30px #0008;max-width:420px;animation:tin .18s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.meter{height:6px;background:var(--card3);border-radius:6px;overflow:hidden}.meter span{display:block;height:100%;background:var(--accent);border-radius:6px}
/* review */
.rv{display:grid;grid-template-columns:280px 1fr;height:100vh}
.rv-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--side)}
.rv-head{padding:16px;border-bottom:1px solid var(--line)}.rv-head .ttl{font-weight:650;font-size:15px}
.srch{position:relative;margin-top:12px}.srch input{width:100%;padding-right:62px}.srch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none}
.secs{overflow:auto;padding:8px;flex:1}
.grp{border-radius:10px;margin-bottom:2px}.grp.act{background:var(--card2)}
.gh{display:flex;align-items:center;gap:8px;padding:8px 10px}.gh[onclick]{cursor:pointer}
.gh .gt{flex:1;font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gh .gn{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.st{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:10px;flex-shrink:0;color:#06150d}.st.part{border-color:var(--warn)}.st.ok{background:var(--ok);border-color:var(--ok)}
.iss{width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;cursor:help}
.sr{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 10px 6px 34px;border-radius:8px;cursor:pointer;color:var(--muted);text-align:left;font-size:13px}
.sr .mut{margin-left:auto;font-variant-numeric:tabular-nums}.sr:hover{color:var(--text)}.sr.on{color:var(--text);background:var(--accent-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex-shrink:0}.dot.ok{background:var(--ok)}.dot.part{background:var(--warn)}
.sidefoot{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.rv-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.crumbs{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:14px 20px 0}.crumbs b{color:var(--text);font-weight:500}.crumbs a{color:var(--muted);cursor:pointer}.crumbs a:hover{color:var(--text)}
.bar{padding:10px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar .h1{font-size:19px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .h1 span{color:var(--muted);font-weight:400;font-size:14px;margin-left:6px}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);padding:3px;border-radius:10px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}.tabs button.on{background:var(--accent);color:#fff}
.tabs button b{font-weight:500;opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
.seg2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}.seg2 button{border:0;background:none;color:var(--muted);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:12px}.seg2 button.on{background:var(--card3);color:var(--text)}
.notes:empty{display:none}.notes{display:grid;gap:6px;padding:10px 20px 0}.notes .warn{padding:7px 12px}
.warn.info{background:var(--card2);color:var(--muted)}.warn.acc{background:var(--accent-soft);color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.warn.okb{background:#2fd18b1a;color:var(--ok)}
.path{word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12px;opacity:.85}
.grid{flex:1;overflow:auto;padding:14px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,200px),1fr));gap:12px;align-content:start;grid-auto-rows:max-content}
.tile{position:relative;border-radius:11px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;outline:none;transition:transform .12s ease,box-shadow .12s ease}
.tile:hover{transform:translateY(-1px);border-color:var(--line2)}
.tile .im{aspect-ratio:4/3;background:#06080c center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px;transition:opacity .25s ease}
.tile .im[data-src]:not(.ld){background-color:var(--card2);animation:pulse 1.2s ease-in-out infinite}
.tile.ctx .im{opacity:.6}.tile.on .im{opacity:1}
.tile.on{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}.tile.fc{box-shadow:0 0 0 2px var(--blue)}.tile.on.fc{box-shadow:0 0 0 2px var(--blue),0 0 0 4px var(--accent)}
.tile .cap{display:flex;justify-content:space-between;padding:7px 9px;font-size:11.5px;color:var(--muted);gap:6px}.tile .cap b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile .cap .role{color:var(--gold);font-weight:600}
.chk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid #ffffffb0;background:#0006;display:grid;place-items:center}
.tile.on .chk{background:var(--accent);border-color:#fff}.tile.on .chk:after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.star{position:absolute;top:7px;left:8px;width:22px;height:22px;border-radius:6px;background:#0008;color:var(--gold);font-size:14px;display:grid;place-items:center}
.star.uns{background:var(--warn);color:#2a1b00;font-weight:800}
.sug{position:absolute;top:9px;left:8px;background:#4db5ffe6;color:#04121f;border-radius:6px;font-size:10.5px;padding:2px 7px;font-weight:600}
.flag{position:absolute;bottom:38px;left:8px;background:#ff5d70e6;color:#fff;font-size:10.5px;border-radius:6px;padding:2px 7px}
.other{position:absolute;bottom:38px;left:8px;background:#000b;color:#fff;font-size:10.5px;border-radius:6px;padding:2px 7px}
.more{position:absolute;right:8px;bottom:38px;width:28px;height:24px;border-radius:7px;border:0;background:#000b;color:#fff;cursor:pointer;font-size:15px;line-height:1;opacity:0;transition:opacity .1s}
.tile:hover .more,.tile:focus-within .more,.tile .more.show{opacity:1}
.foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--side)}
.kitsum{display:flex;align-items:center;gap:12px}.kitsum .ki{width:38px;height:38px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--accent)}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

const STATUS={imported:'Импортирована',analyzed:'В отборе',reviewed:'Отобрана',exported:'Готово'};
let S={page:'overview',sub:null,stats:null,cfg:null,sid:'',sess:null,sec:0,tab:'all',sel:new Set(),period:'month',anchor:new Date(),cmp:'prev',atab:'perf',undo:[]};
try{S.sid=localStorage.getItem('fobox.sid')||''}catch(e){}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({error:'Ошибка сервера'}));if(!r.ok)throw Error(j.error||'Ошибка');return j}

const secs=v=>v==null?'—':v<90?Math.round(v)+' с':v<5400?Math.round(v/60)+' мин':(v/3600).toFixed(1)+' ч';
function initials(n){return (n||'Ф').split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function avatarStyle(p){return p&&p.avatar?`style="background-image:url('${p.avatar}');color:transparent"`:''}
function side(){const p=S.cfg?.profile||{};
 $('#side').innerHTML=`<div class="brand" onclick="$('#side').classList.toggle('open')" title="Развернуть меню"><span class="logo">F</span><span class="bname">Fobo<b>X</b> 4.0</span></div>
 <nav><button class="nb new" title="Новая съёмка" onclick="importDlg()">${ico('plus')}<span>Новая съёмка</span></button>${PAGES.map(([k,t,i])=>`<button class="nb ${S.page===k?'on':''}" title="${t}" onclick="go('${k}')">${ico(i)}<span>${t}</span></button>`).join('')}</nav>
 <div class="sp"></div><button class="nb me" title="Профиль фотографа" onclick="go('settings','Профиль')"><span class="av" ${avatarStyle(p)}>${esc(initials(p.name))}</span><span>${esc(p.name||'Профиль фотографа')}</span></button>`}
async function go(p,sub){if(typeof flush==='function')await flush();S.page=p;S.sub=sub||null;$('#side').classList.remove('open');side();render();window.scrollTo(0,0)}
const UI_VERSION='4.0a2.7';
async function load(){[S.stats,S.cfg]=await Promise.all([api('/api/stats'),api('/api/settings')]);if(S.cfg.version!==UI_VERSION)staleBanner();applyTheme();if(!S.sid&&S.stats.sessions[0])S.sid=S.stats.sessions[0].id;if(S.sid&&!S.stats.sessions.some(x=>x.id===S.sid))S.sid=S.stats.sessions[0]?.id||'';side();render()}
function applyTheme(){const s=S.cfg.settings;document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--c1',s.accent);document.documentElement.style.setProperty('--accent-soft',s.accent+'24');document.documentElement.dataset.theme=s.theme;S.cmp=S.cmp||s.compare_to||'prev'}
function render(){document.querySelector('.coach')?.remove();const m=$('#main');if(S.page==='shoot')return renderShoot();const f={overview,analytics,history,settings}[S.page]||overview;m.innerHTML='<div class="page">'+f()+'</div>';if(S.page==='settings')bindSettings();hydrate()}
function hydrate(){document.querySelectorAll('[data-bg]').forEach(el=>{const im=new Image();im.onload=()=>el.style.backgroundImage=`url('${el.dataset.bg}')`;im.src=el.dataset.bg})}
function staleBanner(){if($('#stale'))return;const d=document.createElement('div');d.id='stale';d.className='toast';d.style.cssText='left:50%;right:auto;transform:translateX(-50%);top:16px;bottom:auto;border-color:var(--warn);max-width:560px';
 d.innerHTML='<b>Программа обновилась — перезапустите её.</b><br><span class="mut">В окне PowerShell нажмите Ctrl+C, снова запустите <kbd>py -3 fobox4.py</kbd> и обновите страницу.</span>';document.body.append(d)}
const empty=t=>`<div class="empty">${t}</div>`;

const NODATA='Нет данных за этот период';
// ---------- periods
function rng(period,anchor,shift){const y=anchor.getFullYear(),m=anchor.getMonth();
 if(period==='month'){const a=new Date(y,m-shift,1);return[a,new Date(a.getFullYear(),a.getMonth()+1,1)]}
 if(period==='year'){return[new Date(y-shift,0,1),new Date(y-shift+1,0,1)]}return[new Date(2000,0,1),new Date(2100,0,1)]}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function cmpRange(){if(S.period==='all')return null;if(S.period==='month'&&S.cmp==='year')return rng('month',new Date(S.anchor.getFullYear()-1,S.anchor.getMonth(),1),0);return rng(S.period,S.anchor,1)}
function inR(d,r){return d&&r&&d>=iso(r[0])&&d<iso(r[1])}
function agg(r){const ss=r?S.stats.sessions.filter(s=>inR(s.shoot_date,r)):[];const sum=k=>ss.reduce((a,s)=>a+(s[k]||0),0);
 const fl={};ss.forEach(s=>Object.entries(s.flags||{}).forEach(([k,v])=>fl[k]=(fl[k]||0)+v));const hs=ss.filter(s=>s.hours!=null);
 const dd={};ss.forEach(s=>Object.entries(s.durations||{}).forEach(([k,v])=>{if(v!=null&&k!=='review_per_section'){(dd[k]=dd[k]||[]).push(v)}}));
 const days=new Set(ss.map(s=>s.shoot_date)).size;
 return{ss,n:ss.length,frames:sum('frames'),hours:hs.length?hs.reduce((a,s)=>a+s.hours,0):null,kits:sum('kits'),students:sum('students'),selected:sum('selected'),analyzed:sum('analyzed'),flags:fl,
  suggested:sum('suggested'),accepted:sum('accepted'),replaced:sum('replaced'),manual:sum('manual_added'),untouched:sum('untouched'),approved:sum('approved'),days,
  fph:hs.length&&hs.reduce((a,s)=>a+s.hours,0)>0.05?hs.reduce((a,s)=>a+s.frames,0)/hs.reduce((a,s)=>a+s.hours,0):null,

 return{t:`${pc>0?'↑':pc<0?'↓':'→'} ${Math.abs(pc)}% ${S.cmp==='year'&&S.period==='month'?'к прошлому году':S.period==='month'?'к прошлому месяцу':'к прошлому году'}`,cls:pc===0?'':good?'up':'down'}}
function filters(){const lbl=S.period==='month'?`${MONTHS[S.anchor.getMonth()][0].toUpperCase()+MONTHS[S.anchor.getMonth()].slice(1)} ${S.anchor.getFullYear()}`:S.period==='year'?`${S.anchor.getFullYear()} год`:'Всё время';
 const now=new Date();const atEnd=S.period==='month'?S.anchor.getFullYear()*12+S.anchor.getMonth()>=now.getFullYear()*12+now.getMonth():S.anchor.getFullYear()>=now.getFullYear();
 return `<div class="filters"><div class="seg">${[['month','Месяц'],['year','Год'],['all','Всё время']].map(([v,t])=>`<button class="${S.period===v?'on':''}" onclick="S.period='${v}';render()">${t}</button>`).join('')}</div>
 ${S.period!=='all'?`<div class="mnav"><button onclick="shiftA(-1)" aria-label="Назад">‹</button><span>${lbl}</span><button onclick="shiftA(1)" ${atEnd?'disabled':''} aria-label="Вперёд">›</button></div>`:''}
 ${S.period==='month'?`<select onchange="S.cmp=this.value;render()" aria-label="Сравнение"><option value="prev" ${S.cmp==='prev'?'selected':''}>к прошлому месяцу</option><option value="year" ${S.cmp==='year'?'selected':''}>к этому месяцу год назад</option></select>`:S.period==='year'?'<span class="mut">сравнение с прошлым годом</span>':''}</div>`}
function shiftA(d){const a=S.anchor;S.anchor=S.period==='month'?new Date(a.getFullYear(),a.getMonth()+d,1):new Date(a.getFullYear()+d,a.getMonth(),1);render()}
// ---------- charts (SVG, drawn to scale)
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e}
function bars(labels,series,opt={}){const W=opt.w||720,H=opt.h||200,pl=34,pr=opt.line?40:8,pt=10,pb=24;const cw=W-pl-pr,chh=H-pt-pb;
 const mx=Math.max(4,niceMax(Math.max(1,...series.flatMap(s=>s.values))));const n=labels.length,gw=cw/n,bw=Math.max(2,Math.min(16,(gw-4)/series.length));
 let g='';for(let i=0;i<=4;i++){const y=pt+chh-chh*i/4;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(Math.round(mx*i/4))}</text>`}

 si=si??secOf(path);const x=S.sess.sections[si];if(!x)return;

 const p=v.list[v.i],si=v.sis[v.i],x=S.sess.sections[si],f=S.fmap[p];const m=x.mandatory[p],on=S.sels[x.id].has(p);

 const c=$('#strip .cur');if(c)c.scrollIntoView({inline:'center',block:'nearest'});[v.list[v.i+1],v.list[v.i+2],v.list[v.i-1]].filter(Boolean).forEach(y=>{const im=new Image();im.src=prevURL(y,1800)})}

 [['Экспорт заказа…','Проверка и копирование',()=>{closeL();if(S.page!=='shoot')go('shoot');setTimeout(exportDlg,50)}],['Новая съёмка','Импорт папки',()=>importDlg()],['Перепроверить качество','С текущими порогами',()=>{closeL();reanalyze()}],['Отменить последнее действие','Ctrl+Z',()=>{closeL();undo()}],['Горячие клавиши','?',()=>helpDlg()]].forEach(([t,s,run])=>it.push({t,s,k:'Команда',run}));

function preflight(){const d=S.sess;const un=d.sections.map((x,i)=>[x,i]).filter(([x])=>!d.approved[x.id]);const items=[];
 d.sections.forEach((x,i)=>Object.entries(x.unsure||{}).forEach(([k,t])=>{if(!d.approved[x.id])items.push({lvl:'info',t:`${x.title}: ${unsMsg(k,t)}`,i})}));
 d.conflicts.forEach(t=>{const i=d.sections.findIndex(x=>x.person&&t.startsWith(x.title+', '));items.push({lvl:'bad',t,i})});
 un.forEach(([x,i])=>items.push({lvl:'warn',t:`Не подтверждено: ${x.title} — ${x.subtitle}`,i}));
 d.sections.forEach((x,i)=>Object.entries(x.mandatory).forEach(([p,k])=>{const f=S.fmap[p];if(f&&f.flags)items.push({lvl:'info',t:`${x.title}: ${ALAB[k]} помечен «${f.flags.split(',').map(y=>d.flag_names[y]).join(', ')}» — проверьте`,i})}));
 return items}
async function exportDlg(){await flush();const ss=S.sess.session,meta=JSON.parse(ss.meta||'{}');const school=ss.mode==='school';const pf=preflight();const blocking=pf.filter(x=>x.lvl!=='info');

 <div class="f"><label for="e_out">Папка для экспорта</label><div class="row"><input id="e_out" value="${esc(meta.output||'')}" placeholder="F:\\FOBOX_EXPORT"><button class="btn" onclick="pick('e_out','dir')">Обзор…</button></div></div>

async function exp(dry){const out=$('#e_out').value.trim(),info=$('#e_info');try{const meta={session:S.sid,output:out};if($('#e_bg'))meta.background=$('#e_bg').value.trim();await api('/api/meta',meta);S.sess.session.meta=JSON.stringify({...JSON.parse(S.sess.session.meta||'{}'),output:out});

 $('#e_go').disabled=true;const r=await api('/api/export',{session:S.sid,output:out});const t0=Date.now();
 for(;;){const j=await api('/api/job?id='+encodeURIComponent(r.job));const pc=j.total?j.done/j.total*100:2;const el=(Date.now()-t0)/1000;const eta=j.done&&j.total?Math.round(el/j.done*(j.total-j.done)):null;
  info.innerHTML=`<div class="mut">${esc(j.stage||'')} ${j.total?`${j.done} из ${j.total}`:''}${j.bytes_total?` · ${(j.bytes_done/1048576).toFixed(0)} из ${(j.bytes_total/1048576).toFixed(0)} МБ`:''}${eta!=null&&j.done<j.total?` · осталось ~${eta<60?eta+' с':Math.ceil(eta/60)+' мин'}`:''}</div><div class="prog"><span style="width:${pc}%"></span></div>`;
  if(j.error)throw Error(j.error);if(j.finished){const x=j.result;info.innerHTML=`<div class="warn okb"><b>${x.update?`Досборка готова: добавлено ${x.new}, всего в заказе ${x.files} файлов.`:`Готово: скопировано ${x.files} файлов, ${(x.bytes/1048576).toFixed(1)} МБ.`}</b><br><span class="path">${esc(x.root)}</span><div class="row" style="margin-top:10px"><button class="btn pri sm" onclick="openOut()">Открыть папку</button><span class="mut">Отчёт: _FOBOX_отчёт.csv${x.warnings&&x.warnings.length?` · замечаний: ${x.warnings.length} (_FOBOX_замечания.txt)`:''}</span></div></div>`;S.sess.session.status='exported';const g=$('#e_go');if(g){g.disabled=false;g.textContent='Дособрать'};api('/api/stats').then(s=>S.stats=s);return}
  await new Promise(r=>setTimeout(r,300))}}catch(e){info.innerHTML=`<div class="warn err" style="margin:0">${esc(e.message)}</div>`;const g=$('#e_go');if(g)g.disabled=false}}
